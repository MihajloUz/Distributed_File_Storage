<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { display: flex; flex-direction: column; width: 300px; gap: 8px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        
        .error {
            font-size: 12px;
            color: red;
            display: none;
        }
        .error.active {
            display: block;
        }
    </style>
</head>
<body>

    <form novalidate>
        <h2>Sign Up</h2>
        
        <input type="email" id="mail" placeholder="Enter e-mail" required minlength="8" autocomplete="email">
        <span class="error" aria-live="polite"></span>

        <input type="password" id="pass1" placeholder="Create password" required minlength="6" autocomplete="new-password">
        <span class="error" aria-live="polite"></span>

        <input type="password" id="pass2" placeholder="Repeat password" required autocomplete="new-password">
        <span class="error" aria-live="polite"></span>

        <button type="submit">Sign Up</button>
    </form>

    <script>
        const form = document.getElementsByTagName("form")[0];

        const email = document.getElementById("mail");
        const emailError = document.querySelector("#mail + span.error");

        const pass1 = document.getElementById("pass1");
        const pass1Error = document.querySelector("#pass1 + span.error");

        const pass2 = document.getElementById("pass2");
        const pass2Error = document.querySelector("#pass2 + span.error");

        //Валидация Email
        email.addEventListener("input", function () {
            if (email.validity.valid) {
                emailError.textContent = "";
                emailError.className = "error";
            } else {
                showEmailError();
            }
        });

        pass1.addEventListener("input", function () {
            if (pass1.validity.valid) {
                pass1Error.textContent = "";
                pass1Error.className = "error";
            } else {
                showPass1Error();
            }
        
            if (pass2.value) validatePasswordMatch();
        });

        pass2.addEventListener("input", validatePasswordMatch);

        function validatePasswordMatch() {
            if (pass2.validity.valueMissing) {
                pass2Error.textContent = "Please repeat your password.";
                pass2Error.className = "error active";
            } else if (pass1.value !== pass2.value) {
                pass2Error.textContent = "Passwords do not match.";
                pass2Error.className = "error active";
            } else {
                pass2Error.textContent = "";
                pass2Error.className = "error";
            }
        }

        form.addEventListener("submit", function (event) {
            let isValid = true;

            if (!email.validity.valid) {
                showEmailError();
                isValid = false;
            }

            if (!pass1.validity.valid) {
                showPass1Error();
                isValid = false;
            }

            if (!pass2.value || pass1.value !== pass2.value) {
                validatePasswordMatch();
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault();
            } else {
                event.preventDefault();
                alert("Form successfully submitted!");
            }
        });

        function showEmailError() {
            if (email.validity.valueMissing) {
                emailError.textContent = "You need to enter an e-mail address.";
            } else if (email.validity.typeMismatch) {
                emailError.textContent = "Entered value needs to be an e-mail address.";
            } else if (email.validity.tooShort) {
                emailError.textContent = `Email should be at least ${email.minLength} characters; you entered ${email.value.length}.`;
            }
            emailError.className = "error active";
        }

        function showPass1Error() {
            if (pass1.validity.valueMissing) {
                pass1Error.textContent = "You need to enter a password.";
            } else if (pass1.validity.tooShort) {
                pass1Error.textContent = `Password should be at least ${pass1.minLength} characters; you entered ${pass1.value.length}.`;
            }
            pass1Error.className = "error active";
        }

        form.addEventListener("submit", async function (event) {
  event.preventDefault();

  //Собираем данные формы
  const userData = {
    email: email.value,
    password: pass1.value
  };

  try {
    //запрос на сервер
    const response = await fetch("http://localhost:8000/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(userData)
    });

    if (response.ok) {
      alert("Registration succesfuly!");
      window.location.href = "welcome.html"; 
    } else {
      const errorData = await response.json();
      alert("Error: " + (errorData.message || "Invalid registration"));
    }
  } catch (error) {
    console.error("Network error:", error);
    alert("No server connection");
  }
});
    </script>
</body>
</html>
