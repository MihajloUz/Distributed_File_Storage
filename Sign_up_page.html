<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { display: flex; flex-direction: column; width: 300px; gap: 10px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #message { margin-top: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <form id="signupForm">
        <h2>Sign Up</h2>
        <input type="email" id="email" placeholder="Enter e-mail" required>
        <input type="password" id="pass1" placeholder="Create password" required>
        <input type="password" id="pass2" placeholder="Repeat your password" required>
        <button type="submit" id="submitBtn">Sign Up</button>
        <div id="message"></div>
    </form>

    <script>
        const form = document.getElementById('signupForm');
        const emailInput = document.getElementById('email');
        const pass1Input = document.getElementById('pass1');
        const pass2Input = document.getElementById('pass2');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        // Динамічна перевірка паролів під час введення
        function validatePasswords() {
            const pass1 = pass1Input.value;
            const pass2 = pass2Input.value;

            if (!pass2) {
                messageDiv.textContent = '';
                submitBtn.disabled = false;
                return;
            }

            if (pass1 === pass2) {
                messageDiv.textContent = 'Passwords match';
                messageDiv.style.color = 'green';
                submitBtn.disabled = false;
            } else {
                messageDiv.textContent = 'Passwords do not match';
                messageDiv.style.color = 'red';
                submitBtn.disabled = true;
            }
        }

        pass1Input.addEventListener('input', validatePasswords);
        pass2Input.addEventListener('input', validatePasswords);

        // Обробка відправки форми
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (pass1Input.value !== pass2Input.value) {
                messageDiv.textContent = 'Passwords do not match';
                messageDiv.style.color = 'red';
                return;
            }

            messageDiv.style.color = 'black';
            messageDiv.textContent = 'Verification...';

            try {
                const response = await fetch('http://localhost:8000/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: emailInput.value, 
                        password: pass1Input.value 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = data.message || 'Success!';
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = data.detail || 'Registration error';
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Server error';
            }
        });
    </script>

</body>
</html>
