services:
  nginx:
    image: nginx:alpine
    ports: 
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rust
      - python 

  rust: 
    build: 
      context: .
      dockerfile: rust_backend/Dockerfile
    env_file:
      - .env
    expose:
      - "8001"
    depends_on:
      - db
    volumes:
      - user_data:/app/user_data
  python: 
    build: 
      context: .
      dockerfile: python_logic/Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
      - rust
    volumes:
      - user_data:/app/user_data
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  user_data: 

