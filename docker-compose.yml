services:
  rust: 
    build: 
      context: ./rust_backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - user_data:/app/user_data
  python: 
    build: 
      context: ./python_logic
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "80:8000"
    depends_on:
      - db
      - rust
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  user_data: 

