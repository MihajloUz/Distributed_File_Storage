services:
  rust: 
    build: 
      context: ./rust_backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8001:80"
    depends_on:
      - db
      - python
    volumes:
      - user_data:/app/user_data
  python:
    build:
      context: ./python_backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:80"
    depends_on:
      - db
    volumes:
      - user_data:/app/user_data
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:


