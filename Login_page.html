<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Authentication</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        form { display: flex; flex-direction: column; width: 300px; gap: 10px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <form id="loginForm">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Login" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div id="message"></div>
    </form>

    <script>
        const form = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            messageDiv.style.color = 'black';
            messageDiv.textContent = 'Verification..';

            try {
                const response = await fetch('http://127.0.0', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = data.message;
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = data.detail || 'Authentication';
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Нет связи с сервером';
            }
        });
    </script>

</body>
</html>
